                create: true
                path: ./out
        - uses: git-clear
          config:
            path: ./out/${{ vars.envDir }}
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./src/workloads/podinfo/overlays/${{ vars.envDir }}
            images:
              - image: ${{ vars.imageRepo }}
                tag: ${{ imageFrom(vars.imageRepo).Tag }}
        - uses: kustomize-build
          config:
            path: ./src/workloads/podinfo/overlays/${{ vars.envDir }}
