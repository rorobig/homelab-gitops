metadata:
  name: prod
  namespace: podinfo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: podinfo
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      vars:
        - name: sourceRepo
          value: https://github.com/rorobig/homelab-gitops.git
        - name: hydratedRepo
          value: https://github.com/rorobig/homelab-gitops-hydrated.git
