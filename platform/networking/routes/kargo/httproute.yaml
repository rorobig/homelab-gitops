# kargo.home.arpa -> the Kargo API server (namespace "kargo"). Same shape as ../argocd/httproute.yaml.
# Log in with the admin account: username "admin", password is the one printed when kargo-bootstrap-secrets
# was created (see apps/00-platform/kargo.yaml) -- it isn't in git, so if you've lost it, generate a new
# hash/key and re-apply the Secret; the API server will pick it up on its next restart.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo-http
  namespace: kargo
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: http
  hostnames:
    - kargo.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kargo-api
          port: 80
