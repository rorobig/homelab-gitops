apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-http
  namespace: keycloak
spec:
  parentRefs:
    - name: shared-gateway
      namespace: traefik
      sectionName: http
  hostnames:
    - keycloak.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080
