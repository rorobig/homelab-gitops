# A function is a small program Crossplane runs to turn your request (the XR) into real resources.
# patch-and-transform is the simplest one: "copy this field from the XR into that resource".
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.2
