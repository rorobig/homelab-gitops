# The Gateway: HTTP on port 80 of this cluster's LoadBalancer IP.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/rorobig/homelab-gitops.git
    targetRevision: main
    path: platform/networking/gateway/mgmt
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
