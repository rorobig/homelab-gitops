# Serves *.home.arpa for the LAN: answers every HTTPRoute hostname with the gateway IP, forwards everything else
# upstream. MetalLB puts it on 192.168.1.70:53, sharing the IP with the gateway. Point your PC's DNS at .70.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://k8s-gateway.kryptonian.kapsi.fi/
    chart: k8s-gateway
    targetRevision: 3.7.3
    helm:
      valuesObject:
        domain: home.arpa
        watchedResources: ["HTTPRoute"]
        service:
          useTcp: true
          annotations:
            metallb.io/loadBalancerIPs: 192.168.1.70
            metallb.io/allow-shared-ip: lan
  destination:
    server: https://kubernetes.default.svc
    namespace: dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
