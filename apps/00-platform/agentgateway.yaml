apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: cr.agentgateway.dev/charts
    chart: agentgateway
    targetRevision: v1.5.0
    helm:
      valuesObject:
        # Controller ServiceMonitor only. The proxy PodMonitor and the dashboard come from
        # apps/10-observability/agentgateway-monitoring (the chart's versions have a label/datasource mismatch).
        # Needs the Prometheus CRDs, so kube-prometheus-stack syncs first (wave 1).
        monitoring:
          enabled: true
          proxy:
            podMonitor:
              enabled: false
          grafanaDashboard:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
