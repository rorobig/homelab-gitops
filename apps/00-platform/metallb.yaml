# MetalLB: gives LoadBalancer Services a real LAN IP (Talos has no built-in load balancer, unlike k3s's ServiceLB).
# In L2 mode one node answers ARP for the IP and another takes over if it dies. The IP pool is in
# platform/networking/metallb/ (wave 2, after the CRDs from this chart exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.1
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged # the speaker needs hostNetwork + NET_RAW
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
