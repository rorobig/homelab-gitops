# MCP demo: a tiny tool server (workloads/mcp/) behind agentgateway at http://mcp.home.arpa/mcp.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/rorobig/homelab-gitops.git
    targetRevision: main
    path: workloads/mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
