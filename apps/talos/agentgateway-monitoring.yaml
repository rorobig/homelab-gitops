# Prometheus scraping + Grafana dashboard for agentgateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: talos-agentgateway-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/rorobig/homelab-gitops.git
    targetRevision: main
    path: platform/observability/agentgateway
  destination:
    name: talos
    namespace: agentgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
