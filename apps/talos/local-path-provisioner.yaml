# Default StorageClass. Volumes live on one node and are lost when CAPI replaces that node.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: talos-local-path-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/rancher/local-path-provisioner.git
    targetRevision: v0.0.37
    path: deploy/chart/local-path-provisioner
    helm:
      valuesObject:
        storageClass:
          defaultClass: true
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths: ["/var/mnt/local-path-provisioner"]
  destination:
    name: talos
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        maxDuration: 3m
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
