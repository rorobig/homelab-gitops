# The root Application ("app of apps"): watches the apps/ folder and creates one Argo CD Application per file there.
# This is the only thing applied by hand (the Ansible argocd-bootstrap role does it); everything else follows from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rorobig/homelab-gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

