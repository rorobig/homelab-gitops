# No `images:` override here on purpose: Kargo's kustomize-set-image promotion step injects the image
# tag at promotion time (see platform/delivery/podinfo/stages.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-prod
resources:
  - ../../base
patches:
  - target:
      kind: HTTPRoute
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: podinfo-prod.home.arpa
