# No `images:` override here on purpose: Kargo's kustomize-set-image promotion step injects the image
# tag at promotion time (see platform/delivery/podinfo/stages.yaml). Running `kustomize build` on this
# overlay by hand gives you the base image with no tag (effectively `:latest`) -- that's only meant to
# happen inside a Kargo promotion, never as the thing Argo CD actually deploys.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-dev
resources:
  - ../../base
patches:
  - target:
      kind: HTTPRoute
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: podinfo-dev.home.arpa
