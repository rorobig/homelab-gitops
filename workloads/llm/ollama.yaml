# The actual AI model. This part has nothing to do with agentgateway: it's just a server that runs a small
# open model (qwen2.5:0.5b) on CPU and answers over an OpenAI-style HTTP API. agentgateway sits IN FRONT of it
# (backend.yaml points at the Service below), so nobody talks to Ollama directly.
#
# On start it downloads the model (~400 MB) and only reports Ready once it has it, so the first start takes a
# minute or two. The model lives in an emptyDir, so a restart downloads it again. To try a different model, change
# the name here AND in backend.yaml / pirate.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.34.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull qwen2.5:0.5b
              wait
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_KEEP_ALIVE
              value: 24h
          ports:
            - name: http
              containerPort: 11434
          # Ready only once the model has been downloaded.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "ollama list | grep -q qwen2.5:0.5b"]
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
