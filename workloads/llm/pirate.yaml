# Magic #1: the gateway rewrites the request. The caller sends a plain question to pirate.home.arpa;
# agentgateway prepends a system prompt before it reaches the same local model. No app change needed.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ollama-pirate
spec:
  ai:
    provider:
      openai:
        model: qwen2.5:0.5b
      host: ollama.ai.svc.cluster.local
      port: 11434
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: pirate-persona
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: ollama-pirate
  backend:
    ai:
      prompt:
        prepend:
          - role: system
            content: "You are a grumpy pirate. Answer in one or two sentences, always in pirate speak, and mention the sea."
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pirate
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
      sectionName: http
  hostnames:
    - pirate.home.arpa
  rules:
    - backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: ollama-pirate
