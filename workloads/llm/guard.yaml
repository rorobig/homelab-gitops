# WHAT THIS IS: a "prompt guard", a bouncer at the door of the AI.
#
# Every prompt sent to llm.home.arpa, failover.home.arpa or an agent's /v1 calls (all three end at the "ollama" or
# "smart" backend) passes through the gateway before reaching the model. The guard reads the prompt on the way
# through and can act BEFORE the model ever sees it. The rule lives in the gateway, so no app has to implement it,
# and no app can forget to. (pirate.home.arpa uses its own backend, ollama-pirate, and is not guarded.)
#
# An AgentgatewayPolicy means "attach extra behaviour to something else". It does nothing on its own;
# targetRefs says what it is attached to.
#
#   targetRefs            attach to the AgentgatewayBackends named "ollama" (backend.yaml) and "smart"
#                         (failover.yaml), so every request going to either backend is checked. A policy only
#                         guards what it targets: a new backend needs its own line here.
#   backend.ai.promptGuard  the AI-specific checks:
#     request:            checks on the PROMPT (what the user sends).
#                         (A matching `response:` list would check the model's ANSWER; not used here.)
#       - regex:          "look for text that matches a pattern"
#           builtins:     ready-made patterns the gateway ships with. The full list is:
#                         CreditCard, Email, PhoneNumber, Ssn, CaSin.  (Only CreditCard is tried here.)
#                         You can also add your own with `matches: ["<regex>"]`.
#           action:       what to do when something matches:
#                           Reject  block it: the client gets an error and the model is never called (used here)
#                           Mask    let it through, but hide the matched text first. This is the default.
#                                   (Tried: the request is accepted and the log shows "action": "mask".)
#                           Audit   let it through untouched and only record that it matched (not tried)
#         response:       what the client receives on Reject: HTTP 403 plus our message.
#
# TRY IT:   ./scripts/llm-demo.sh blocked
# THEN:     kubectl -n agentgateway-system logs deploy/agentgateway-proxy --tail=5
#           and look for   agw.ai.guardrails=[{"phase": "request", "guard": "regex", "action": "reject"}]
# TWEAK:    change `action: Reject` to `Mask`, push, wait ~20 s (the proxy needs a moment to pick it up), and retry.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-guard
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: ollama
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: smart
  backend:
    ai:
      promptGuard:
        request:
          - regex:
              action: Reject
              builtins:
                - CreditCard
            response:
              statusCode: 403
              message: "Blocked by agentgateway: prompt contains a credit card number."
